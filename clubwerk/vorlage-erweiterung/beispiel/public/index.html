<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beispiel</title>
<link rel="stylesheet" href="../../style.css">
<link rel="stylesheet" href="../../theme.css">
<style>
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 22px; background: var(--green); color: #fff; }
  header.top h1 { margin: 0; font-size: 22px; }
  header.top nav { display: flex; align-items: center; gap: 22px; }
  header.top nav a { color: #fff; opacity: .75; font-size: 15px; text-decoration: none; padding: 4px 0; border-bottom: 2px solid transparent; }
  header.top nav a.on { opacity: 1; font-weight: 700; border-bottom-color: #fff; }
  header.top .clock { font-size: 20px; opacity: .9; }
  main { padding: 18px 22px; }
</style>
</head>
<body>
<header id="gkHeader"></header>
<main><ul id="list"></ul></main>
<!-- Kopfzeile wie auf allen Tablet-Seiten: data-active = id der Erweiterung -->
<script src="../../nav.js" data-base="../../" data-active="beispiel"></script>
<script src="tablet.js"></script>
</body>
</html>
