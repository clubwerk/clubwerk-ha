<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6b3a">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="theme-init.js"></script>
<title>Verwaltung</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme.css">
<style>
  html, body { height: 100%; }
  body { height: 100dvh; }   /* iPhone: sichtbare Höhe ohne die Safari-Leisten – sonst liegt das Ende der Verwaltung unter der Leiste */
  body { display: flex; flex-direction: column; overflow: hidden; margin: 0; }
  iframe { flex: 1; min-height: 0; width: 100%; border: 0; background: var(--bg); }
</style>
</head>
<body>
<header id="gkHeader"></header>
<script src="nav.js" data-base="" data-active="verwaltung"></script>
<!-- Verwaltung läuft unter der Kopfzeile; kein automatisches Zurückspringen -->
<!-- eigener Pfad tadmin/: eigene Sitzung, die Abmeldung nach 60 s trifft keine Anmeldung über admin.html -->
<iframe id="frame" src="tadmin/admin.html" title="Verwaltung"></iframe>
</body>
</html>
