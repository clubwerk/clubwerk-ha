<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Keine Verbindung</title>
  <meta name="theme-color" content="#1f6b3a">
  <!-- Hinweisseite der Mitglieder-App ohne Netz (sw.js zeigt sie nur, wenn das Netz scheitert). Liegt mit ihren Dateien im Zwischenspeicher,
       darum keine Daten, keine Anfragen an die API und nur Dateien aus der Liste in sw.js (FILES). -->
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="kit.css">
  <style>
    .off-wrap { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); box-sizing: border-box; }
    .off-ico { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 32px; background: var(--brand-soft); color: var(--brand-ink); display: flex; align-items: center; justify-content: center; }
    .off-ico svg { width: 30px; height: 30px; }
    .off-wrap h1 { margin: 0 0 6px; font-size: 20px; line-height: 26px; }
  </style>
</head>
<body class="vh-page">
<main class="off-wrap">
  <div class="vh-box" role="alert">
    <div class="off-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2.01-1.5"/><path d="M2 8.82a15 15 0 0 1 4.18-2.65"/><path d="M22 8.82a15 15 0 0 0-11.29-3.76"/><path d="m2 2 20 20"/></svg></div>
    <h1 id="offT">Keine Verbindung</h1>
    <p id="offD" aria-live="polite">Der Verein ist gerade nicht erreichbar. Prüfe WLAN oder mobile Daten und versuche es dann noch einmal.</p>
    <button type="button" class="vh-btn vh-wide" id="offRetry">Erneut versuchen</button>
  </div>
</main>
<script src="offline.js"></script>
</body>
</html>
