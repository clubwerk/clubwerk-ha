<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f6b3a">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="theme-init.js"></script>
<title>Clubwerk</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="kit.css">   <!-- gemeinsame Bausteine (Gerätekacheln) wie in App und am Tablet -->
<style>
  body { font-size: 14px; line-height: 20px; }
  /* ---------- Rahmen: Seitenleiste + Inhalt ---------- */
  .shell { display: grid; grid-template-columns: 256px minmax(0, 1fr); min-height: 100vh; min-height: 100dvh; }
  nav.side { background: var(--card); border-right: 1px solid var(--line); position: sticky; top: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; min-width: 0; }
  nav.side .brandbox { display: flex; align-items: center; gap: 12px; padding: 18px 20px; background: var(--brand); color: var(--on-brand); min-height: 76px; box-sizing: border-box; }
  nav.side .brandbox .mark { width: 44px; height: 44px; flex: 0 0 44px; border-radius: 12px; background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; color: var(--brand); font-weight: 800; font-size: 14px; }
  nav.side .brandbox .mark img { max-width: 36px; max-height: 36px; object-fit: contain; }
  nav.side .brandbox b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 14px; line-height: 18px; font-weight: 700; overflow: hidden; }
  nav.side .brandbox small { display: block; font-size: 12px; line-height: 16px; opacity: .85; }
  nav.side .brandbox > div { min-width: 0; }
  nav.side .navbody { flex: 1; overflow: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; }
  nav.side .navbody > * { flex-shrink: 0; }   /* wenig Höhe: Menü scrollt, Einträge werden nie zusammengedrückt */
  nav.side .search { position: relative; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; margin-bottom: 12px; border-radius: 10px; background: var(--hover); color: var(--muted); }
  nav.side .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 14px; color: var(--ink); }
  nav.side .search kbd { font-family: inherit; font-size: 11px; font-weight: 600; line-height: 16px; padding: 0 6px; border-radius: 6px; background: var(--card); color: var(--muted); }
  @media (max-width: 900px), (hover: none) { nav.side .search kbd { display: none; } }   /* Handy/Tablet: keine Tastatur, kein Tastenhinweis */
  nav.side .search .results { position: absolute; left: 0; right: 0; top: 44px; z-index: 30; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-pop); padding: 6px; display: flex; flex-direction: column; gap: 2px; }
  nav.side .search .results { max-height: min(70vh, 560px); overflow-y: auto; overscroll-behavior: contain; }
  nav.side .search .results button { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-height: 36px; padding: 6px 10px; border-radius: 8px; color: var(--ink); text-align: left; }
  nav.side .search .results button b { font-weight: 600; font-size: 14px; line-height: 18px; }
  nav.side .search .results button span { color: var(--muted); font-size: 12px; line-height: 16px; }
  nav.side .search .results .sh { padding: 8px 10px 2px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .cw-hit { outline: 3px solid var(--brand); outline-offset: 4px; border-radius: 12px; transition: outline-color .4s; }   /* Ziel eines Suchtreffers */
  nav.side .search .results button.sel, nav.side .search .results button:hover { background: var(--hover); }
  nav.side .grp { height: 24px; line-height: 24px; margin-top: 16px; padding: 0 12px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
  nav.side button.nav { display: flex; align-items: center; gap: 12px; width: 100%; height: 40px; padding: 0 12px; border-radius: 10px; color: var(--ink); font-size: 14px; font-weight: 600; text-align: left; position: relative; }
  nav.side button.nav svg { flex: 0 0 18px; color: var(--muted); }
  nav.side button.nav:hover { background: var(--hover); }
  nav.side button.nav.on { background: var(--brand-soft); color: var(--brand-ink); font-weight: 700; }
  nav.side button.nav.on svg { color: var(--brand); }
  nav.side button.nav.on::before { content: ''; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 4px; border-radius: 0 4px 4px 0; background: var(--brand); }
  nav.side .badge { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 10px; background: var(--brand); color: var(--on-brand); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
  nav.side .badge.a { background: var(--amber-soft); color: var(--amber); }
  nav.side .badge.r { background: var(--red); color: var(--on-red); }   /* Datensicherung: fehlt oder zu alt */
  nav.side .userchip { display: flex; flex-direction: column; gap: 10px; margin: 12px; padding: 12px; border-radius: 12px; background: var(--hover); }
  nav.side .userchip .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
  nav.side .userchip .ucbtns { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
  nav.side .userchip .ucbtns .iconbtn { width: auto; flex: none; height: 34px; }
  nav.side .userchip .av { width: 32px; height: 32px; flex: 0 0 32px; border-radius: 16px; background: var(--brand); color: var(--on-brand); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; }
  nav.side .userchip .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  nav.side .userchip .nm b { font-size: 13px; line-height: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  nav.side .userchip .nm span { font-size: 12px; line-height: 16px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  nav.side .iconbtn, .iconbtn { width: 32px; height: 32px; flex: 0 0 32px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); background: var(--card); text-decoration: none; }
  nav.side .iconbtn:hover, .iconbtn:hover { color: var(--ink); }
  nav.side .menutoggle { display: none; }
  .content { min-width: 0; display: flex; flex-direction: column; }
  .pagebar { padding: 28px 40px 0; display: flex; flex-direction: column; gap: 14px; }
  .pagebar:empty { display: none; }
  .pagebar .crumb { font-size: 13px; line-height: 16px; font-weight: 600; color: var(--brand-ink); display: flex; align-items: center; gap: 8px; }
  .pagebar .crumb::before { content: ''; width: 8px; height: 8px; border-radius: 4px; background: var(--brand); }
  main.content, main#main { padding: 20px 40px 56px; max-width: 1280px; width: 100%; box-sizing: border-box; }
  .pagebar:empty + main#main { padding-top: 32px; }
  /* Seitenkopf */
  h2.page { margin: 0 0 4px; font-size: 28px; line-height: 36px; font-weight: 700; letter-spacing: -.02em; }
  /* Tabellen: Datum, Uhrzeit, Beträge nie umbrechen */
  .nw, .tbl td.nw, .tbl th.nw { white-space: nowrap; }
  /* Leerzustand – überall gleich: ruhige Fläche, Satz mittig (statt mal grauer Zeile, mal Karte, mal links) */
  p.empty { margin: 0; padding: 22px 16px; border-radius: 12px; background: var(--hover); color: var(--muted); text-align: center; font-size: 14px; line-height: 1.45; text-wrap: pretty; }
  .card > h3 + p.empty, .card > .row + p.empty, .card > div + p.empty, .card > table + p.empty { margin-top: 4px; }
  p.lead { margin: 0 0 24px; color: var(--muted); max-width: 1100px; text-wrap: pretty; }   /* ausgewogener Umbruch – kein einzelnes Wort allein in Zeile 2 */
  /* Einleitung über Reitern: immer zwei Zeilen hoch (Reiter springen beim Wechsel nicht); längere Texte enden mit „…“ und „mehr“ */
  .leadbox { position: relative; min-height: 2lh; margin: 0 0 24px; max-width: 1100px; }
  .leadbox > p.lead { margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .leadbox > p.lead + p.lead { display: none; }
  .leadbox.open > p.lead { display: block; overflow: visible; }
  .leadbox.open > p.lead + p.lead { margin-top: 8px; }
  .leadbox .leadmore { position: absolute; right: 0; bottom: 0; padding: 0 0 0 10px; border: 0; background: var(--bg); font: inherit; font-weight: 600; color: var(--brand-ink); cursor: pointer; }
  .leadbox.open .leadmore { position: static; padding: 0; margin-top: 4px; background: none; }
  @media (max-width: 640px) { .row > label.f { flex: 1 1 100% !important; } }   /* Handy: Felder einer Zeile untereinander, volle Breite – nie zusammengedrückt */
  @media (max-width: 640px) { .leadbox .leadmore, .leadbox.open .leadmore { position: static; display: inline-flex; align-items: center; min-height: 32px; padding: 0; margin: 0; background: none; } }   /* Handy: „mehr“ als eigene, gut tippbare Zeile unter dem Text */
  /* Karten, Kennzahlen */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .card h3 { margin: 0 0 12px; font-size: 16px; line-height: 24px; font-weight: 700; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 16px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px; }
  .kpi .l { color: var(--muted); font-size: 13px; font-weight: 600; }
  .kpis .kpi { justify-content: flex-end; }   /* Zahlen stehen auf einer Linie, auch wenn ein Label zwei Zeilen braucht */
  .kpi .v { font-size: 24px; line-height: 32px; font-weight: 700; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .kpi a { color: var(--brand-ink); font-weight: 700; font-size: 13px; text-decoration: none; margin-top: auto; }
  .kpi.warn { background: var(--amber-soft); border-color: var(--amber-line); }
  /* Artikel: Symbol, Bild oder Kürzel */
  .atile { width: 32px; height: 32px; flex: 0 0 32px; border-radius: 9px; background: var(--ib, var(--brand-soft)); color: var(--if, var(--brand)); display: inline-flex; align-items: center; justify-content: center; overflow: hidden; font-size: 11px; font-weight: 800; letter-spacing: .02em; }
  .atile img { width: 100%; height: 100%; object-fit: contain; }
  .atile.img { background: #fff; border: 1px solid var(--line-soft); }
  :root[data-theme="dark"] .atile:not(.img) { background: color-mix(in srgb, var(--if, var(--brand)) 22%, transparent); color: color-mix(in srgb, var(--if, var(--brand)) 55%, #fff); }
  .atile.lg { width: 72px; height: 72px; flex-basis: 72px; border-radius: 18px; font-size: 20px; }
  .tbl .art { display: flex; align-items: center; gap: 10px; }
  .artlook { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 16px; align-items: start; margin-top: 16px; padding: 16px; border-radius: 14px; background: var(--hover); }
  .artlook .seg { background: var(--card); width: fit-content; margin-bottom: 12px; }
  .artlook .seg button.on { background: var(--brand-soft); color: var(--brand-ink); box-shadow: none; }
  .icgrid { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; max-height: 236px; overflow: auto; padding: 2px; }
  .icgrid .gl { grid-column: 1 / -1; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin: 6px 0 0; }
  .icgrid .gl:first-child { margin-top: 0; }
  .icgrid button { aspect-ratio: 1; border-radius: 10px; background: var(--ib, var(--card)); color: var(--if, var(--brand)); display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); }
  .icgrid button:hover { border-color: var(--brand); }
  .icgrid button.on { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand); }
  .imgpick { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  @media (max-width: 700px) { .icgrid { grid-template-columns: repeat(6, minmax(0, 1fr)); } .artlook { grid-template-columns: 1fr; } }
  /* Import: je vorhandenem Artikel entscheiden */
  .impdecide { display: flex; flex-direction: column; gap: 10px; max-height: 46vh; overflow: auto; padding: 2px; }
  .impcard { border: 1px solid var(--amber-line); background: var(--amber-soft); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .impcard.done { border-color: var(--line); background: var(--card); }
  .impcard table.tbl { background: transparent; width: auto; min-width: 360px; align-self: flex-start; }
  .impcard .tbl td, .impcard .tbl th { padding-right: 32px; white-space: nowrap; }
  .impcard .tbl td:first-child { width: 90px; }
  .impcard .tbl td, .impcard .tbl th { height: 32px; }
  .impcard .seg { width: fit-content; }
  .impcard .seg button.on { background: var(--brand); color: var(--on-brand); }
  /* Werkzeugleiste, Filter, Mitglieder mit Detailansicht */
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
  /* Einheitlich: Aktionen einer Seite stehen rechts, die Hauptaktion ganz rechts (Suche und Filter links). Reine Knopfleisten werden daher gespiegelt. */
  .toolbar:not(:has(.seg, .search, input, select, .tabs, label)) { flex-direction: row-reverse; justify-content: flex-start; }
  .filterbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 0 0 16px; }
  .filterbar .search { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); color: var(--muted); flex: 1 1 180px; min-width: 160px; max-width: 320px; box-sizing: border-box; }   /* Suche gibt Platz ab, damit die Filter in einer Zeile bleiben */
  .filterbar .search:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .filterbar .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; height: 38px; padding: 0; box-shadow: none; font-size: 14px; color: var(--ink); }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 12px; background: var(--hover); }
  .seg button { height: 32px; padding: 0 12px; border-radius: 8px; font-size: 13.5px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .seg button:hover { color: var(--ink); }
  .seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
  .seg .cnt { min-width: 20px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--line-soft); color: var(--muted); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; }
  .seg button.on .cnt { background: var(--brand-soft); color: var(--brand-ink); }
  .mlayout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
  .mlist .scroll { margin: 0; }
  .tbl.sel tr[data-sel] { cursor: pointer; }
  .tbl.sel tr[data-sel]:hover td { background: var(--hover); }
  .tbl.sel tr[data-sel].on td { background: var(--brand-soft); }
  .tbl.sel tr[data-sel].on td:first-child { box-shadow: inset 3px 0 0 var(--brand); }
  .tbl .who { display: flex; align-items: center; gap: 10px; }
  .tbl .who b { font-weight: 600; }
  .av { width: 32px; height: 32px; flex: 0 0 32px; border-radius: 16px; background: var(--brand-soft); color: var(--brand-ink); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
  .av.lg { width: 52px; height: 52px; flex-basis: 52px; border-radius: 26px; font-size: 17px; background: var(--brand); color: var(--on-brand); }
  .mdetail { position: sticky; top: 20px; margin: 0; padding: 20px; }
  .mdetail .mhead { display: flex; align-items: center; gap: 14px; padding-bottom: 16px; border-bottom: 1px solid var(--line-soft); }
  .mdetail .mhead h3 { margin: 0 0 6px; font-size: 16px; line-height: 24px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mdetail .facts { margin: 0; padding: 8px 0; }
  .mdetail .facts > div { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
  .mdetail .facts dt { color: var(--muted); font-size: 13px; line-height: 20px; }
  .mdetail .facts dd { margin: 0; text-align: right; font-weight: 600; font-size: 14px; line-height: 20px; font-variant-numeric: tabular-nums; }
  .mdetail .facts dd.neg { color: var(--red); }
  .mdetail .mact { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding-top: 12px; }
  .mdetail .mact .btn { width: 100%; justify-content: center; }
  .mdetail .mact .btn:only-child, .mdetail .mact .btn.ghost { grid-column: 1 / -1; }
  .mdetail .mempty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 28px 8px; }
  .mdetail .mempty .mi { width: 48px; height: 48px; border-radius: 14px; background: var(--brand-soft); color: var(--brand); display: flex; align-items: center; justify-content: center; margin-bottom: 4px; }
  @media (max-width: 1100px) { .mlayout { grid-template-columns: 1fr; } .mlayout > .mdetail { display: none; } }   /* schmal: Detail als Dialog (admin.js), die Liste springt nicht */
  @media (max-width: 700px) {
    .kpis { grid-template-columns: 1fr 1fr; gap: 10px; }
    .kpi { padding: 14px 16px; }
    .kpi .v { font-size: 20px; line-height: 28px; }
    .toolbar .btn { flex: 1 1 calc(50% - 4px); }
    .toolbar .btn.primary { flex-basis: 100%; }
    .filterbar .search { width: 100%; }
  }
  /* Formulare */
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
  .row > h3:first-child { line-height: 40px; }
  label.f { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
  label.f { min-width: 0; } label.f > input, label.f > select, label.f > textarea { min-width: 0; max-width: 100%; width: 100%; box-sizing: border-box; }
  /* Jede Auswahlliste sieht gleich aus – auch ohne eigenes Feld drumherum (Klassenregeln gehen vor) */
  :where(select) { min-height: 40px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background-color: var(--field); color: var(--ink); font-family: inherit; font-size: 14px; font-weight: 500; box-sizing: border-box; }
  label.f input:not([type=checkbox]):not([type=radio]), label.f select, label.f textarea, .tbl input:not([type=checkbox]):not([type=radio]), .tbl select {   /* Haken bleiben 16 px – sonst gestaucht bzw. am iPhone riesig */
    min-height: 40px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); font-size: 14px; font-weight: 500; color: var(--ink);
    transition: border-color .15s, box-shadow .15s;
  }
  label.f input:focus, label.f select:focus, label.f textarea:focus, .tbl input:focus, .tbl select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  label.f textarea { min-height: 120px; line-height: 20px; }
  /* Datums-/Zeitfelder: iOS Safari gibt ihnen sonst eine eigene Breite und sie ragen aus dem Fenster */
  label.f input[type=date], label.f input[type=time], label.f input[type=datetime-local], label.f input[type=month] { -webkit-appearance: none; appearance: none; display: block; min-width: 0; width: 100%; text-align: left; }
  label.f input[type=date]::-webkit-date-and-time-value, label.f input[type=time]::-webkit-date-and-time-value { text-align: left; }
  label.chk { display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--ink); }
  input[type=checkbox], input[type=radio] { accent-color: var(--brand); width: 16px; height: 16px; flex: none; }
  /* Schalter (an/aus) */
  .switch { position: relative; width: 44px; height: 24px; flex: 0 0 44px; border-radius: 12px; background: var(--line); transition: background .15s; padding: 0; }
  .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 10px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: left .15s; }
  .switch.on { background: var(--brand); }
  .switch.on::after { left: 22px; }
  .switch:disabled { opacity: .5; }
  /* Tabellen */
  table.tbl { width: 100%; border-collapse: collapse; }
  .tbl th { text-align: left; font-size: 12px; line-height: 16px; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); font-weight: 700; padding: 12px 10px; border-bottom: 1px solid var(--line); background: var(--card); position: sticky; top: 0; }
  .tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  .tbl tr:last-child td { border-bottom: 0; }
  .tbl tr:hover td { background: color-mix(in srgb, var(--hover) 60%, transparent); }
  .tbl td.r, .tbl th.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tbl tr.off td { color: var(--faint); }
  .tbl tr.sum td { font-weight: 700; border-top: 2px solid var(--line); }
  .tbl input.n { width: 76px; text-align: right; }
  .scroll { overflow: auto; max-height: 70vh; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
  /* Marken */
  .pill { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 12px; font-size: 12px; font-weight: 700; background: var(--hover); color: var(--muted); white-space: nowrap; }
  .pill.g { background: var(--brand-soft); color: var(--brand-ink); }
  .pill.a { background: var(--amber-soft); color: var(--amber); }
  .pill.r { background: var(--red-soft); color: var(--red); }
  .pill.b { background: var(--blue-soft); color: var(--blue); }
  .neg { color: var(--red); font-weight: 600; }
  .drop { border: 2px dashed var(--green-line); border-radius: var(--radius); padding: 28px; text-align: center; background: var(--brand-soft); box-shadow: none; }
  .drop.over { background: var(--green-over); border-color: var(--brand); }
  .drop .big { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
