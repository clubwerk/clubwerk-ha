<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f6b3a">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="theme-init.js"></script>
<title>Clubwerk</title>
<link rel="stylesheet" href="style.css">
<link rel="preload" href="fonts/jakarta-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-condensed-600.woff2" as="font" type="font/woff2" crossorigin>   <!-- Ziffernschrift gleich mitladen: sonst springen Ziffern beim ersten Fenster aus der Ersatzschrift um -->
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="kit.css">   <!-- gemeinsame Bausteine (Gerätekacheln) wie in App und am Tablet -->
<style>
  body { font-size: 14px; line-height: 20px; }
  /* ---------- Rahmen: Seitenleiste + Inhalt ---------- */
  /* Seitenmenü: schwebende Glas-Leiste (Klasse .glass aus style.css), daneben der Inhalt */
  .shell { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: 100vh; min-height: 100dvh; }
  nav.side { margin: 14px 0 14px 14px; border-radius: 22px; position: sticky; top: 14px; height: calc(100vh - 28px); height: calc(100dvh - 28px); display: flex; flex-direction: column; min-width: 0; overflow: hidden; box-sizing: border-box; }
  nav.side .brandbox { display: flex; align-items: center; gap: 12px; padding: 14px 18px 6px; color: var(--ink); min-height: 72px; box-sizing: border-box; }
  nav.side .brandbox .mark { width: 42px; height: 42px; flex: 0 0 42px; border-radius: 12px; background: var(--brand); display: flex; align-items: center; justify-content: center; overflow: hidden; color: var(--on-brand); font-weight: 800; font-size: 14px; }
  nav.side .brandbox .mark:has(img) { background: #fff; border: 1px solid var(--line); }
  nav.side .brandbox .mark img { max-width: 34px; max-height: 34px; object-fit: contain; }
  nav.side .brandbox b { display: block; font-size: 14px; line-height: 18px; font-weight: 700; overflow-wrap: break-word; }   /* Vereinsname ganz, auch lang (3.101) */
  nav.side .brandbox small { display: block; font-size: 12px; line-height: 16px; color: var(--muted); }
  nav.side .brandbox > div { min-width: min-content; }   /* der Vereinsname bricht an Leerzeichen um, nie mitten im Wort („Musterstad|t“, wenn der Menüknopf viel Platz braucht) */
  nav.side .navbody { flex: 1; overflow: auto; padding: 6px 12px 8px; display: flex; flex-direction: column; gap: 2px; }
  nav.side .navbody > * { flex-shrink: 0; }   /* wenig Höhe: Menü scrollt, Einträge werden nie zusammengedrückt */
  nav.side .search { position: relative; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; margin-bottom: 10px; border-radius: 12px; background: color-mix(in srgb, var(--card) 70%, transparent); border: 1px solid var(--line); color: var(--muted); }
  nav.side .search:focus-within { outline: 2px solid var(--brand); outline-offset: 2px; }   /* das Feld selbst hat keinen Rahmen – der Rahmen sitzt am ganzen Suchkasten (Punkt 14) */
  nav.side .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 14px; color: var(--ink); }
  nav.side .search kbd { font-family: inherit; font-size: 11px; font-weight: 600; line-height: 16px; padding: 0 6px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); }
  @media (max-width: 900px), (hover: none) { nav.side .search kbd { display: none; } }   /* Handy/Tablet: keine Tastatur, kein Tastenhinweis */
  nav.side .search .results { position: absolute; left: 0; right: 0; top: 44px; z-index: 30; background: var(--card); border: 1px solid var(--edge); border-radius: 14px; box-shadow: var(--shadow-pop); padding: 6px; display: flex; flex-direction: column; gap: 2px; }
  nav.side .search .results { max-height: min(70vh, 560px); overflow-y: auto; overscroll-behavior: contain; }
  nav.side .search .results > * { flex-shrink: 0; }   /* Treffer nie zusammendrücken – sonst läuft ein mehrzeiliger Treffer über den nächsten */
  nav.side .search .results button { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-height: 36px; padding: 6px 10px; border-radius: 8px; color: var(--ink); text-align: left; }
  nav.side .search .results button b { font-weight: 600; font-size: 14px; line-height: 18px; }
  nav.side .search .results button span { color: var(--muted); font-size: 12px; line-height: 16px; }
  nav.side .search .results .sh { padding: 8px 10px 2px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .cw-hit { outline: 3px solid var(--brand); outline-offset: 4px; border-radius: 12px; transition: outline-color .4s; }   /* Ziel eines Suchtreffers */
  tr.cw-hit { outline: 0; } tr.cw-hit > td { background: var(--brand-soft); }
  tr.cw-hit > td:first-child { box-shadow: -10px 0 0 var(--brand-soft); } tr.cw-hit > td:last-child { box-shadow: 10px 0 0 var(--brand-soft); }   /* Tabellenzeile: Rahmen würde am Rand der Liste abgeschnitten (und Safari zeichnet ihn an Zeilen nicht) */
  nav.side .search .results button.sel, nav.side .search .results button:hover { background: var(--hover); }
  nav.side .grp { height: 24px; line-height: 24px; margin-top: 16px; padding: 0 12px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
  nav.side button.nav { display: flex; align-items: center; gap: 12px; width: 100%; height: 40px; padding: 0 12px; border-radius: 10px; color: var(--ink); font-size: 14px; font-weight: 600; text-align: left; position: relative; }
  nav.side button.nav svg { flex: 0 0 18px; color: var(--muted); }
  nav.side button.nav:hover { background: var(--hover); }
  nav.side button.nav.on { background: var(--brand-soft); color: var(--brand-ink); font-weight: 700; }
  nav.side button.nav.on svg { color: var(--brand); }
  :root[data-contrast="hoch"] nav.side button.nav.on { box-shadow: inset 0 0 0 2px var(--brand-ink); }
  /* Punkt für „hier ist etwas zu tun“ (die Zahl steht im Reiter der Seite) */
  nav.side .badge { margin-left: auto; width: 8px; height: 8px; flex: 0 0 8px; border-radius: 50%; background: var(--brand); font-size: 0; overflow: hidden; }
  nav.side .badge.a { background: var(--amber); }
  nav.side .badge.r { background: var(--red); }   /* Datensicherung: fehlt oder zu alt */
  /* Aufklappbare Bereiche (ab 10 Einträgen, planung/seitenleiste.md): Kopfzeile wie ein Eintrag, Einträge eingerückt an einer feinen Linie, ohne eigene Symbole */
  nav.side .navg { display: flex; flex-direction: column; gap: 2px; }
  nav.side button.navb { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 40px; padding: 4px 12px; line-height: 1.25; overflow-wrap: anywhere; border-radius: 10px; color: var(--ink); font-size: 14px; font-weight: 700; text-align: left; }
  nav.side button.navb:hover { background: var(--hover); }
  nav.side button.navb > svg:first-child { flex: 0 0 18px; color: var(--muted); }
  nav.side button.navb > span:not(.badge) { flex: 1; min-width: 0; }
  nav.side button.navb .badge { margin-left: 0; margin-right: 0; }
  nav.side button.navb .chev { flex: 0 0 16px; color: var(--muted); transition: transform .15s; }
  nav.side .navg.open > .navb .chev { transform: rotate(90deg); }
  nav.side .navg.open > .navb .badge { display: none; }   /* offen: die Punkte stehen an den Einträgen */
  nav.side .navg.cur > .navb { color: var(--brand-ink); }
  nav.side .navg.cur > .navb > svg:first-child { color: var(--brand); }
  nav.side .navgi { display: none; flex-direction: column; gap: 2px; margin: 0 0 4px 21px; padding-left: 8px; border-left: 1px solid var(--line2); }
  nav.side .navg.open > .navgi { display: flex; }
  nav.side .navgi button.nav { height: 36px; padding-left: 10px; }
  nav.side .navgi button.nav > svg:first-child { display: none; }
  @media (prefers-reduced-motion: reduce) { nav.side button.navb .chev { transition: none; } }
  /* Benutzerchip in einer Zeile (Name links, Tablet und Abmelden rechts) – lässt der Leiste Platz für einen offenen Bereich (planung/seitenleiste.md) */
  nav.side .userchip { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 12px 12px; padding: 8px 8px 8px 10px; border-radius: 14px; background: color-mix(in srgb, var(--ink) 4%, transparent); }
  nav.side .userchip .who { flex: 1 1 auto; display: flex; align-items: center; gap: 10px; min-width: min-content; min-height: 40px; color: inherit; text-decoration: none; border-radius: 8px; }
  nav.side .userchip a.who:hover .nm b, nav.side .userchip a.who:focus-visible .nm b { text-decoration: underline; }
  nav.side .userchip .ucbtns { display: flex; gap: 4px; margin-left: auto; }   /* passt das längste Wort des Namens nicht daneben, rutschen die Knöpfe in die nächste Zeile (rechts) */
  nav.side .userchip .ucbtns .iconbtn { width: 32px; height: 32px; flex: 0 0 32px; }   /* Rechner: schmal, damit der Name daneben Platz hat (Handy: 40 px) */
  nav.side .userchip .av { width: 32px; height: 32px; flex: 0 0 32px; border-radius: 16px; background: var(--brand); color: var(--on-brand); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; }
  nav.side .userchip .nm { flex: 1; min-width: min-content; display: flex; flex-direction: column; }
  nav.side .userchip .nm b { font-size: 13px; line-height: 18px; overflow-wrap: break-word; }   /* lange Namen brechen an Leerzeichen um, nie mitten im Wort und nie „…“ */
  nav.side .userchip .nm span { font-size: 12px; line-height: 16px; color: var(--muted); }
  nav.side .iconbtn, .iconbtn { width: 32px; height: 32px; flex: 0 0 32px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); background: var(--card); text-decoration: none; }
  nav.side .iconbtn:hover, .iconbtn:hover { color: var(--ink); }
  nav.side .menutoggle { display: none; }
  .content { min-width: 0; display: flex; flex-direction: column; }
  .pagebar { padding: 28px 36px 0; display: flex; flex-direction: column; gap: 14px; }
  .pagebar:empty { display: none; }
  .pagebarrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 32px; }
  .helpbtn { width: 32px; height: 32px; flex: 0 0 32px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); color: var(--muted); font-family: inherit; font-weight: 700; font-size: 15px; line-height: 1; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .helpbtn:hover { color: var(--ink); border-color: var(--muted); }
  .pagebar .crumb { font-size: 13px; line-height: 16px; font-weight: 600; color: var(--brand-ink); display: flex; align-items: center; gap: 8px; }
  .pagebar .crumb::before { content: ''; width: 8px; height: 8px; border-radius: 4px; background: var(--brand); }
  main.content, main#main { padding: 20px 36px 56px; max-width: 1280px; width: 100%; box-sizing: border-box; }
  .pagebar:empty + main#main { padding-top: 32px; }
  /* Seitenkopf */
  h2.page { margin: 0 0 4px; font-size: 30px; line-height: 38px; font-weight: 800; letter-spacing: -.02em; }
  #main > h2.page::after { content: ''; display: block; width: 56px; height: 6px; margin: 6px 0 6px; border-top: 2px solid var(--brand); border-bottom: 1px solid var(--line2); box-sizing: border-box; }   /* Platzlinie unter dem Seitentitel */
  /* Tabellen: Datum, Uhrzeit, Beträge nie umbrechen */
  .nw, .tbl td.nw, .tbl th.nw { white-space: nowrap; }
  /* Leerzustand – überall gleich: ruhige Fläche, Satz mittig (statt mal grauer Zeile, mal Karte, mal links) */
  p.empty { margin: 0; padding: 22px 16px; border-radius: 12px; background: var(--hover); color: var(--muted); text-align: center; font-size: 14px; line-height: 1.45; text-wrap: pretty; }
  .card > h3 + p.empty, .card > div + p.empty, .card > table + p.empty { margin-top: 4px; }
  /* Ergebnisbereich unter einer Knopf-/Feldzeile (z. B. #kOut nach „Prüfen“): immer 12 px Abstand – am Handy bricht die Zeile um, der Knopf darf nie am Kasten darunter kleben (D-5) */
  .row + div:not(:empty), .row + p.empty, .card > .row + p.empty, .dialog > div + p.empty { margin-top: 12px; }   /* Fenster: Leerzustand nie direkt an Feldern darüber (02.11.2026) */
  p.lead { margin: 0 0 24px; color: var(--muted); max-width: 1100px; text-wrap: pretty; }   /* ausgewogener Umbruch – kein einzelnes Wort allein in Zeile 2 */
  /* Einleitung über Reitern: immer zwei Zeilen hoch (Reiter springen beim Wechsel nicht); längere Texte enden mit „…“ und „mehr“ */
  .leadbox { position: relative; min-height: 2lh; margin: 0 0 24px; max-width: 1100px; }
  .leadbox > p.lead { margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .leadbox > p.lead + p.lead { display: none; }
  .leadbox.open > p.lead { display: block; overflow: visible; }
  .leadbox.open > p.lead + p.lead { margin-top: 8px; }
  .leadbox .leadmore { position: absolute; right: 0; bottom: 0; padding: 0 0 0 10px; border: 0; background: var(--bg); font: inherit; font-weight: 600; color: var(--brand-ink); cursor: pointer; }
  .leadbox.open .leadmore { position: static; padding: 0; margin-top: 4px; background: none; }
  @media (max-width: 640px) { .row > label.f { flex: 1 1 100% !important; } }   /* Handy: Felder einer Zeile untereinander, volle Breite – nie zusammengedrückt */
  @media (max-width: 640px) { .leadbox .leadmore, .leadbox.open .leadmore { position: static; display: inline-flex; align-items: center; min-height: 32px; padding: 0; margin: 0; background: none; } }   /* Handy: „mehr“ als eigene, gut tippbare Zeile unter dem Text */
  /* Karten, Kennzahlen */
  .card { background: var(--card); border: 1px solid var(--edge); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .card h3 { margin: 0 0 12px; font-size: 16px; line-height: 24px; font-weight: 700; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 16px; }
  .kpi { background: var(--card); border: 1px solid var(--edge); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px; }
  .kpi .l { color: var(--muted); font-size: 13px; font-weight: 600; }
  .kpis .kpi { justify-content: flex-end; }   /* Zahlen stehen auf einer Linie, auch wenn ein Label zwei Zeilen braucht */
  .kpi .v { font-family: var(--num); font-size: 30px; line-height: 34px; font-weight: 600; font-variant-numeric: tabular-nums; }   /* Zahlen wie auf der Anzeigetafel */
  .kpi a { color: var(--brand-ink); font-weight: 700; font-size: 13px; text-decoration: none; margin-top: auto; }
  .kpi.warn { background: var(--amber-soft); border-color: var(--amber-line); }
  /* Artikel: Symbol, Bild oder Kürzel */
  .atile { width: 32px; height: 32px; flex: 0 0 32px; border-radius: 9px; background: var(--ib, var(--brand-soft)); color: var(--if, var(--brand)); display: inline-flex; align-items: center; justify-content: center; overflow: hidden; font-size: 11px; font-weight: 800; letter-spacing: .02em; }
  .atile img { width: 100%; height: 100%; object-fit: contain; }
  .atile.img { background: #fff; border: 1px solid var(--line-soft); }
  :root[data-theme="dark"] .atile:not(.img) { background: color-mix(in srgb, var(--if, var(--brand)) 22%, transparent); color: color-mix(in srgb, var(--if, var(--brand)) 55%, #fff); }
  .atile.lg { width: 72px; height: 72px; flex-basis: 72px; border-radius: 18px; font-size: 20px; }
  .tbl .art { display: flex; align-items: center; gap: 10px; }
  .artlook { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 16px; align-items: start; margin-top: 16px; padding: 16px; border-radius: 14px; background: var(--hover); }
  .artlook .seg { background: var(--card); width: fit-content; margin-bottom: 12px; }
  .artlook .seg button.on { background: var(--brand-soft); color: var(--brand-ink); box-shadow: none; }
  .icgrid { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; max-height: 236px; overflow: auto; padding: 2px; }
  .icgrid .gl { grid-column: 1 / -1; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin: 6px 0 0; }
  .icgrid .gl:first-child { margin-top: 0; }
  .icgrid button { aspect-ratio: 1; border-radius: 10px; background: var(--ib, var(--card)); color: var(--if, var(--brand)); display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); }
  .icgrid button:hover { border-color: var(--brand); }
  .icgrid button.on { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand); }
  .imgpick { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  @media (max-width: 700px) { .icgrid { grid-template-columns: repeat(6, minmax(0, 1fr)); } .artlook { grid-template-columns: 1fr; } }
  /* Import: je vorhandenem Artikel entscheiden */
  .impdecide { display: flex; flex-direction: column; gap: 10px; max-height: 46vh; overflow: auto; padding: 2px; }
  .impcard { border: 1px solid var(--amber-line); background: var(--amber-soft); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .impcard.done { border-color: var(--line); background: var(--card); }
  .impcard table.tbl { background: transparent; width: auto; min-width: 360px; align-self: flex-start; }
  .impcard .tbl td, .impcard .tbl th { padding-right: 32px; white-space: nowrap; }
  .impcard .tbl td:first-child { width: 90px; }
  .impcard .tbl td, .impcard .tbl th { height: 32px; }
  .impcard .seg { width: fit-content; }
  .impcard .seg button.on { background: var(--brand); color: var(--on-brand); }
  /* Werkzeugleiste, Filter, Mitglieder mit Detailansicht */
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
  /* Einheitlich: Aktionen einer Seite stehen rechts, die Hauptaktion ganz rechts (Suche und Filter links). Reine Knopfleisten werden daher gespiegelt. */
  .toolbar:not(:has(.seg, .search, input, select, .tabs, label)) { flex-direction: row-reverse; justify-content: flex-start; }
  .filterbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 0 0 16px; }
  .filterbar .search { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); color: var(--muted); flex: 1 1 180px; min-width: 160px; max-width: 320px; box-sizing: border-box; }   /* Suche gibt Platz ab, damit die Filter in einer Zeile bleiben */
  .filterbar .search:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .filterbar .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; height: 38px; padding: 0; box-shadow: none; font-size: 14px; color: var(--ink); }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 999px; background: color-mix(in srgb, var(--ink) 6%, transparent); }
  .seg button { height: 32px; padding: 0 12px; border-radius: 999px; font-size: 13.5px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .seg button:hover { color: var(--ink); }
  .seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .seg .cnt { min-width: 20px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--line-soft); color: var(--muted); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; }
  .seg button.on .cnt { background: var(--brand-soft); color: var(--brand-ink); }
  /* Filterchips: Filter derselben Liste und Ansichten derselben Daten (Offen 3 · Bezahlt · Alle) – kleiner und runder als Reiter, damit man sie nicht verwechselt */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips > button { height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid var(--line); background: var(--card); color: var(--muted); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .chips > button:hover { color: var(--ink); border-color: var(--faint); }
  .chips > button.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-ink); }
  .chips .cnt { font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; } .chips .cnt:empty { display: none; }
  .chips > button.on .cnt { color: var(--brand-ink); }
  /* Detailansicht (GK.registerDetail): „← Zurück“ vorn in der einen Reiterzeile, gleich hoch wie die Reiter */
  .detailrow > .detback { padding: 0 14px; flex: none; }
  .mlayout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
  .mlist .scroll { margin: 0; max-height: none; overflow: visible; }   /* Liste ohne eigenen Scrollbereich: die Seite scrollt, das Mausrad wirkt überall (auch über der Karte und daneben), die Kopfzeile klebt oben (Fehler Thorsten 09.11.2026) */
  .mlayout > .mlist { align-self: stretch; display: flex; flex-direction: column; }   /* Liste reicht bis zur Unterkante der Karte, auch bei wenigen Treffern – beide Rahmen enden bündig (Symmetrie, Fehler Thorsten 09.11.2026) */
  .mlayout > .mlist > .scroll:has(> table:not(.hidden)), .mlayout > .mlist > p.empty { flex: 1 0 auto; }
  .mlayout > .mlist > .scroll:not(:has(> table:not(.hidden))) { display: none; }   /* keine Treffer: nur der Leerhinweis, kein leerer Rahmen darüber */
  .tbl.sel tr[data-sel] { cursor: pointer; }
  .tbl.sel tr[data-sel]:hover td { background: var(--hover); }
  .tbl.sel tr[data-sel].on td { background: var(--brand-soft); }
  .tbl.sel tr[data-sel].on td:first-child { box-shadow: inset 3px 0 0 var(--brand); }
  .tbl .who { display: flex; align-items: center; gap: 10px; }
  .tbl .who b { font-weight: 600; }
  .av { width: 32px; height: 32px; flex: 0 0 32px; border-radius: 16px; background: var(--brand-soft); color: var(--brand-ink); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }

    :is(.scroll, .ml-rc):has(> table.tbl.kompakt:not(.k-tabelle)) { border: 0; border-radius: 0; background: none; }   /* Zeilen sind am Handy selbst Karten: kein zweiter Rahmen drumherum (Rahmen lagen seitlich aufeinander, 02.11.2026) */
    .card > table.tbl.kompakt:not(.k-tabelle) { margin-top: 12px; }   /* Zeilen-Karten berühren den Kartenrand nicht (Karten mit Tabelle haben oben/unten keinen Innenabstand) */
    .tbl.kompakt:not(.k-tabelle) td { border: 0; height: auto; min-height: 34px; padding: 5px 0 !important; display: flex; justify-content: space-between; align-items: center; gap: 12px; text-align: right; }
    .tbl.kompakt:not(.k-tabelle) td::before { content: attr(data-label); color: var(--muted); font-size: 13px; text-align: left; flex: none; max-width: 45%; }
    .tbl.kompakt:not(.k-tabelle) td:not([data-label])::before, .tbl.kompakt:not(.k-tabelle) td[data-label=""]::before { content: none; }
    .tbl.kompakt:not(.k-tabelle) td > .tcell { min-width: 0; text-align: right; }
    .tbl.kompakt:not(.k-tabelle) td.r { white-space: normal; flex-wrap: wrap; justify-content: flex-end; }
    .tbl.kompakt:not(.k-tabelle) td.r::before { margin-right: auto; }
    .tbl.kompakt:not(.k-tabelle) td input:not([type=checkbox]):not([type=radio]), .tbl.kompakt:not(.k-tabelle) td select { max-width: 60%; }
    .tbl.kompakt:not(.k-tabelle) tr.sum { background: var(--brand-soft); }
    /* Kompakte Handy-Liste (B-7): <table class="tbl kompakt"> – erste Spalte fett, rechts die Knöpfe der letzten Spalte, darunter die übrigen Werte klein
       nebeneinander in ihrer ganzen Breite – was nicht mehr passt, rutscht in die nächste Zeile; nur ein Wert, der länger ist als die ganze Zeile, endet mit … (voller Text im title). Leere Zellen fallen weg */
    .tbl.kompakt:not(.k-tabelle) tr { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 12px; padding: 6px 12px; }
    .tbl.kompakt:not(.k-tabelle) tr::after { content: ''; order: 2; flex-basis: 100%; }
    .tbl.kompakt:not(.k-tabelle) td { display: block; order: 3; flex: 0 1 auto; max-width: 100%; width: auto !important; min-width: 0; min-height: 0; padding: 0 !important; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; text-align: left; font-size: 13px; line-height: 16px; color: var(--muted); }
    .tbl.kompakt:not(.k-tabelle) td::before { content: none; }
    .tbl.kompakt:not(.k-tabelle) td.r:not(:first-child) { font-size: 14px; line-height: 16px; }   /* Zahlen in der kleinen Zeile so groß wie die übrigen Werte – nicht größer */
    .tbl.kompakt:not(.k-tabelle) td.k-lang:not(:first-child) { flex: 1 1 0; min-width: 96px; } .tbl.kompakt:not(.k-tabelle) td:has(input, select, textarea) { flex: 1 1 0; } .tbl.kompakt:not(.k-tabelle) td:not(:first-child):has(select) { flex-basis: 100%; overflow: visible; } .tbl.kompakt:not(.k-tabelle) td select { width: 100%; max-width: 100%; }   /* Auswahl bekommt eine eigene Zeile: kurze Werte („– frei, sperrt nichts –“) stehen ganz da (02.11.2026) */   /* lange Werte und Eingabefelder füllen den Rest der Zeile statt eine neue zu beginnen */
    .tbl.kompakt:not(.k-tabelle) td > .tcell, .tbl.kompakt:not(.k-tabelle) td > .tcell > div { text-align: left; overflow: hidden; text-overflow: ellipsis; }   /* „…“ zeichnet der Browser nur im Block, der den Text selbst hält – sonst wäre der Wert hart abgeschnitten */
    .tbl.kompakt:not(.k-tabelle) td:first-child { order: 0; flex: 1 1 120px; max-width: none; font-size: 15px; line-height: 20px; font-weight: 600; color: var(--ink); white-space: normal; overflow-wrap: anywhere; }
    .tbl.kompakt:not(.k-tabelle).k-name-voll td:first-child { flex: 1 1 auto; }   /* Name so breit wie nötig: ein langer Name steht allein in der Zeile, der Knopf rutscht darunter; kurze Namen bleiben neben dem Knopf („Rücklastschrift“) */
    .tbl.kompakt:not(.k-tabelle) td:last-child:not(:first-child):has(button, a.btn, .acts) { order: 1; flex: none; overflow: visible; max-width: 100%; white-space: normal; } .tbl.kompakt:not(.k-tabelle) td:last-child .btn { white-space: nowrap; }   /* mehrere Knöpfe rutschen in die nächste Zeile statt aus der Karte zu ragen (Safari setzt breiter) */
    .tbl.kompakt:not(.k-tabelle) .pill.k-wrap { max-width: 100%; height: auto; padding: 2px 10px; line-height: 1.25; white-space: normal; }   /* lange Schilder („gehört nicht zu Clubwerk“) brechen um statt am Rand abgeschnitten zu werden */
    .tbl.kompakt:not(.k-tabelle) td.k-sum { display: block; }
    .tbl.kompakt:not(.k-tabelle) td:not(:first-child):has(> .chk) { flex: 0 0 auto; max-width: none; overflow: visible; }   /* nicht die erste Spalte: dort steht der Name samt Häkchen und füllt die Zeile (3.101) */
    .tbl.kompakt:not(.k-tabelle) td > .chk { gap: 6px; font-size: 13px; }
    .tbl.kompakt:not(.k-tabelle) tr[data-row] { cursor: pointer; }
    .tbl.kompakt:not(.k-tabelle) td:empty, .tbl.kompakt:not(.k-tabelle) .k-weg { display: none; }   /* k-weg: am Handy weglassen (steht beim Antippen bzw. Bearbeiten) – ganze Zelle oder ein Teil davon */
    .tbl.kompakt:not(.k-tabelle) td.k-lbl::before { content: attr(data-label) ' '; display: inline; color: var(--muted); font-size: 12px; font-weight: 500; }   /* k-lbl: Spaltenname davor (z. B. „Benutzer: 3“) */
    .tbl.kompakt:not(.k-tabelle) td.k-1z { white-space: normal; overflow-wrap: break-word; font-size: 14px; }   /* k-1z: Namen etwas kleiner; lange Namen brechen um statt abgeschnitten zu werden (3.101) */
    .tbl.kompakt:not(.k-tabelle) td.k-datei { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }   /* k-datei: Dateinamen einzeilig, voller Name im title (Länge hängt von Datum und Uhrzeit ab) */
    .tbl.kompakt:not(.k-tabelle) td:first-child .muted { font-weight: 400; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .tbl.kompakt:not(.k-tabelle) td:first-child .k-sum { display: block; width: 0; min-width: 100%; white-space: normal; overflow-wrap: break-word; }   /* k-sum in der ersten Spalte: Zusatzzeile nur am Handy (z. B. die Tätigkeit unter dem Namen) – bricht um statt „…“ (3.101) */
    .tbl.kompakt:not(.k-tabelle) tr:has(> td:last-child .acts > :nth-child(2)) > td:first-child { flex-basis: 64px; min-width: min-content; }   /* zwei Knöpfe rechts: Platz für beide in der ersten Zeile – aber nie schmaler als das längste Wort des Namens, sonst rutschen die Knöpfe darunter (3.101; vorher Wortsäule) */
    .tbl.kompakt:not(.k-tabelle) td[colspan] { flex: 1 1 100%; max-width: none; white-space: normal; }
  }
  /* Tablet-Liste (701–1279 px) zeigt mehr als die Handy-Liste: Spalten, die am Handy wegfallen (k-weg), und reine Zahlen (k-zbl) erscheinen mit ihrer Spaltenüberschrift – bei 690 px Inhalt ist Platz, und „bisher“, Rhythmus, Art usw. sind Teil der Entscheidung. „–“ ohne Wert fällt weg. Nicht Teil der Kopie (`kompakt-kopie`). */
  @media (min-width: 701px) and (max-width: 1279px) {
    .tbl.kompakt:not(.k-tabelle) td.k-weg:not(:empty):not(.k-dash) { display: block; }
    .tbl.kompakt:not(.k-tabelle) td.k-weg:not(:empty):not(.k-dash):not(.k-lbl):not(.k-zbl)::before { content: attr(data-label) ' '; display: inline; color: var(--muted); font-size: 12px; font-weight: 500; }
    .tbl.kompakt:not(.k-tabelle) td.k-dash { display: none; }
    .tbl.kompakt:not(.k-tabelle) td.k-zbl::before { content: attr(data-label) ' '; display: inline; color: var(--muted); font-size: 12px; font-weight: 500; }   /* k-zbl: reine Zahl (auch Datum/Uhrzeit allein) ohne Einheit bekommt ihre Spaltenüberschrift (Gebinde 24, Mindestbestand 0) – von labelTables in admin.js gesetzt; nur in der Tablet-Liste: am Handy würden die Zeilen über die 96 px (B-7) wachsen */
  }
