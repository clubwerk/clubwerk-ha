name: Clubwerk
version: "3.60.0"
slug: clubwerk
description: Clubwerk – die modulare Vereinsverwaltung für Home Assistant – Getränke (Tablet statt Strichliste), Zeiterfassung, Beregnung, Zugang und mehr; mehrsprachig
arch:
  - aarch64
  - amd64
  - armv7
init: true
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:home-group
panel_title: Clubwerk
panel_admin: true
ports:
  3100/tcp: 3100
  5000/tcp: 5000
  5001/tcp: 5001
ports_description:
  3100/tcp: Tablet und Verwaltung im Vereins-WLAN (mit HTTPS, wenn eingeschaltet)
  5000/tcp: Beregnungs-Webapp (nur wenn das Modul Beregnung aktiv ist; mit HTTPS, wenn eingeschaltet)
  5001/tcp: Mitglieder-App (Handys der Mitglieder – Buchen, Türen, Beregnung …; mit HTTPS, wenn eingeschaltet; von außen nur über Cloudflare Tunnel)
# Beregnung (und später Zugang) schalten Geräte über Home Assistant
homeassistant_api: true
# USB-Stick (LTE-Modem) für SMS-Codes beim Freischalten der Mitglieder-App: serielle Geräte des Hosts durchreichen
uart: true
backup: hot
# Vor jedem Home-Assistant-Backup einen konsistenten Datenbank-Schnappschuss ziehen
backup_pre: node /app/src/backup.js pre
backup_post: node /app/src/backup.js post
backup_exclude:
  - "*.db-wal"
  - "*.db-shm"
watchdog: tcp://[HOST]:[PORT:3100]
# Zusätzliche Erweiterungen liegen in /share/clubwerk/erweiterungen (per Samba erreichbar, nur lesend)
map:
  - share:ro
  - ssl:ro
  # Update per ZIP-Upload in der Verwaltung: neuen Stand in den eigenen Add-on-Ordner schreiben
  - addons:rw
# … und Home Assistant bitten, das Add-on danach zu aktualisieren (neu zu bauen)
hassio_api: true
hassio_role: manager
options:
  notfall_passwort: ""
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
  proxy_addon_ip: ""
schema:
  notfall_passwort: password?
  ssl: bool
  certfile: str
  keyfile: str
  proxy_addon_ip: str?
