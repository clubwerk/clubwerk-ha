<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6b3a">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icon.svg" type="image/svg+xml">
<script src="../../theme-init.js"></script>
<title>Plätze</title>
<link rel="stylesheet" href="../../style.css">
<link rel="stylesheet" href="../../theme.css">
<style>
  :root { --np: 16px; }
  body { user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 22px; background: var(--green); color: #fff; }
  header.top h1 { margin: 0; font-size: 22px; font-weight: 700; }
  header.top .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .logo-badge { background: #fff; border-radius: 999px; padding: 3px; display: flex; align-items: center; justify-content: center; flex: none; }
  .logo-badge img { height: 50px; max-width: 140px; object-fit: contain; display: block; }
  header.top nav { display: flex; align-items: center; gap: 22px; }
  header.top nav a { color: #fff; opacity: .75; font-size: 15px; text-decoration: none; padding: 4px 0; border-bottom: 2px solid transparent; }
  header.top nav a.on { opacity: 1; font-weight: 700; border-bottom-color: #fff; }
  header.top nav .ext { font-size: 12px; opacity: .8; }
  .perr { color: var(--red); font-weight: 700; min-height: 22px; margin-top: 10px; }
  .pin-note { font-size: 16px; line-height: 1.5; color: var(--muted); margin: 14px 0 4px; text-align: center; }
  .names { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: left; max-height: 50vh; overflow: auto; margin-top: 10px; }
  .names button, .choice button { min-height: 56px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font: inherit; font-size: 16px; font-weight: 600; color: var(--ink); padding: 0 12px; text-align: left; }
  .choice { display: flex; flex-direction: column; gap: 8px; text-align: left; }
  .choice button { display: flex; align-items: center; gap: 10px; }
  .choice button::before { content: ''; flex: none; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); box-sizing: border-box; }
  .choice button.on { border-color: var(--brand, #1f6b3a); box-shadow: 0 0 0 2px var(--brand, #1f6b3a) inset; }
  .choice button.on::before { border: 5px solid var(--brand, #1f6b3a); }
  .dialog input.q { width: 100%; height: 54px; border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; font-size: 18px; background: var(--field); color: var(--ink); box-sizing: border-box; user-select: text; -webkit-user-select: text; }
  .dlg-btns { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; margin-top: 14px; }
  .dlg-btns button { height: 56px; border-radius: 14px; font: inherit; font-size: 18px; font-weight: 700; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .dlg-btns .ok { background: var(--brand); border-color: var(--brand); color: #fff; }

    /* Gestaltung: Tablet-Kit in style.css (Seite, Seitenkopf, Fenster, PIN-Feld, Sperrseite) – hier nur der Platzplan */
  .bk-areas { display: inline-flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--hover); }
  .bk-areas button { min-height: 44px; min-width: 120px; padding: 0 18px; border-radius: 11px; border: 0; background: transparent; font: inherit; font-size: 16px; font-weight: 700; color: var(--muted); }
  .bk-areas button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
  /* Belegungsplan – derselbe Aufbau wie in der Verwaltung und in der Mitglieder-App: Plätze nebeneinander, Zeitachse links, Buchungen als Blöcke */
  .bk-board { display: block; }
  .bk-plan { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
  .bk-grid { display: grid; grid-template-columns: 64px repeat(var(--n), minmax(0, 1fr)); }
  .bk-grid .hd { position: sticky; top: 0; z-index: 4; background: var(--card); border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); min-height: 64px; padding: 8px 6px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .bk-grid .hd:first-child { border-left: 0; }
  .bk-grid .hd b { font-size: 18px; font-weight: 800; line-height: 22px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bk-grid .hd small { font-size: 13px; color: var(--muted); font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .bk-grid .tc { position: relative; }
  .bk-grid .tc span { position: absolute; right: 10px; transform: translateY(-50%); font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bk-grid .cl { position: relative; border-left: 1px solid var(--line); background-image: linear-gradient(to bottom, var(--line) 1px, transparent 1px); background-size: 100% var(--ph); cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .bk-grid .zu { position: absolute; left: 0; right: 0; background: repeating-linear-gradient(135deg, var(--hover) 0 8px, transparent 8px 16px); pointer-events: none; }
  .bk-grid .past { position: absolute; left: 0; right: 0; top: 0; background: color-mix(in srgb, var(--hover) 70%, transparent); pointer-events: none; }
  .bk-grid .nowl { position: absolute; left: 0; right: 0; height: 2px; background: var(--red); z-index: 2; pointer-events: none; }
  .bk-blk { position: absolute; left: 4px; right: 4px; border-radius: 12px; padding: 6px 10px; box-sizing: border-box; overflow: hidden; border: 1px solid var(--line); background: var(--hover); color: var(--ink); text-align: left; font: inherit; display: flex; flex-direction: column; z-index: 3; }
  .bk-blk > b, .bk-blk > span { display: block; flex: none; line-height: 20px; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bk-blk > b { font-weight: 800; } .bk-blk > .tm { font-size: 13.5px; opacity: .85; font-variant-numeric: tabular-nums; }
  .bk-blk.buchung { background: var(--brand-soft); color: var(--brand-ink); border-color: color-mix(in srgb, var(--brand) 30%, transparent); }   /* Farben wie in der Verwaltung */
  .bk-blk.serie { background: color-mix(in srgb, var(--blue, #2f6fd6) 14%, var(--card)); color: var(--ink); border-color: color-mix(in srgb, var(--blue, #2f6fd6) 35%, transparent); }
  .bk-blk.sperre { background: repeating-linear-gradient(135deg, var(--red-soft) 0 8px, color-mix(in srgb, var(--red-soft) 50%, var(--card)) 8px 16px); color: var(--red); border-color: color-mix(in srgb, var(--red) 30%, transparent); }
  .bk-hint { margin: 10px 2px 0; font-size: 14px; color: var(--muted); }
  .bk-past { display: flex; justify-content: center; align-items: center; gap: 8px; min-height: 44px; border-radius: 14px; border: 1px dashed var(--line); background: var(--card); color: var(--muted); font: inherit; font-size: 15px; }
  .bk-past b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .bk-slot.past { opacity: .4; } .bk-slot.now { box-shadow: inset 4px 0 0 var(--brand); }
  .bk-empty { color: var(--muted); font-size: 16px; text-align: center; padding: 30px; }
  .dialog .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; text-align: left; }
  .dialog .durs { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin: 6px 0 4px; }
  .dialog .durs button { min-height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font: inherit; font-size: 16px; font-weight: 700; color: var(--ink); }
  .dialog .durs button.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .dialog .lbl { text-align: left; font-size: 14px; font-weight: 700; color: var(--muted); margin: 12px 0 6px; }
  .dialog .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-start; }
  .dialog .lbl span { font-weight: 600; color: var(--muted); } .dialog .lbl.who { font-size: 17px; color: var(--ink); margin-top: 16px; }
  .dialog .req { text-align: left; font-size: 14.5px; color: var(--muted); background: var(--field); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 0 0 6px; }
  .dialog .row2 button.add { height: 54px; border-radius: 12px; border: 1px solid var(--line); background: var(--hover); font: inherit; font-size: 16px; font-weight: 700; color: var(--ink); }
  .dialog .row2 { grid-template-columns: minmax(0, 1fr) auto; } .dialog .row2 button.add { padding: 0 18px; }
  .dialog .pick { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-start; }
  .dialog .pick button { min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid var(--line); background: var(--card); font: inherit; font-size: 16px; font-weight: 700; color: var(--ink); }
  .dialog .pick button.on { background: var(--brand-soft, var(--hover)); border-color: var(--brand); color: var(--brand-ink, var(--ink)); }
  .dlg-btns button:disabled { opacity: .45; }
  .dialog .chips span { display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 6px 0 14px; border-radius: 19px; background: var(--brand-soft); color: var(--brand-ink); font-weight: 700; }
  .dialog .chips span button { width: 28px; height: 28px; border-radius: 14px; border: 0; background: rgba(0,0,0,.06); font-size: 16px; color: inherit; }
  .dialog .rules { text-align: left; font-size: 14px; color: var(--muted); background: var(--field); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; white-space: pre-wrap; max-height: 120px; overflow: auto; margin-top: 10px; }
  .dialog .chk { display: flex; gap: 10px; align-items: center; justify-content: flex-start; font-size: 16px; margin-top: 10px; text-align: left; } .dialog .chk input { width: 24px; height: 24px; }
  .bk-plan .bk-past { width: 100%; border-radius: 0; border: 0; border-bottom: 1px solid var(--line); }   /* Leiste „vorbei“ oben im Plan – wie in Verwaltung und App */
</style>
</head>
<body class="tk">
<header id="gkHeader"></header>
<main>
  <div class="tab-head"><div><h1 class="tab-title" id="dayTitle">Heute</h1><p class="tab-sub" id="daySub">Freie Zeit antippen zum Buchen</p></div><div class="bk-areas" id="areas"></div></div>
  <div class="bk-board" id="board"></div>
</main>
<div id="gate" class="gate hidden"><div class="gatecard">
  <h2>Seite gesperrt</h2>
  <p>Bitte das Passwort des Vereins eingeben. Dieses Gerät bleibt danach freigeschaltet.</p>
  <input type="password" id="gatePw" placeholder="Passwort" autocomplete="current-password">
  <div class="gerr" id="gateErr"></div>
  <button class="btn primary" id="gateGo">Freischalten</button>
</div></div>
<div id="overlay" class="overlay hidden"><div class="dialog" id="dialog"></div></div>
<div id="toast" class="toast hidden"></div>
<script src="../../nav.js" data-base="../../" data-active="buchung"></script>
<script src="tablet.js"></script>
</body>
</html>
