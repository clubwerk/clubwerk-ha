<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6b3a">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icon.svg" type="image/svg+xml">
<script src="../../theme-init.js"></script>
<title>Mitglied werden</title>
<link rel="stylesheet" href="../../style.css">
<link rel="stylesheet" href="../../theme.css">
<style>
  :root { --np: 16px; }
  body { user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 22px; background: var(--green); color: #fff; }
  header.top h1 { margin: 0; font-size: 22px; font-weight: 700; }
  header.top .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .logo-badge { background: #fff; border-radius: 999px; padding: 3px; display: flex; align-items: center; justify-content: center; flex: none; }
  .logo-badge img { height: 50px; max-width: 140px; object-fit: contain; display: block; }
  header.top nav { display: flex; align-items: center; gap: 22px; }
  header.top nav a { color: #fff; opacity: .75; font-size: 15px; text-decoration: none; padding: 4px 0; border-bottom: 2px solid transparent; }
  header.top nav a.on { opacity: 1; font-weight: 700; border-bottom-color: #fff; }
  header.top nav .ext { font-size: 12px; opacity: .8; }
  main { padding: 22px 22px 40px; }
  .af, .af input { user-select: text; -webkit-user-select: text; }
  .mw-start { max-width: 820px; margin: 4vh auto 0; display: flex; flex-direction: column; gap: 18px; }
  .mw-start h2 { margin: 0; font-size: 30px; line-height: 38px; }
  .mw-start p { margin: 0; color: var(--muted); font-size: 17px; line-height: 1.5; }
  .mw-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 8px; }
  .mw-tiles button { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; min-height: 190px; padding: 24px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); box-shadow: inset 5px 0 0 var(--brand), var(--shadow); font: inherit; color: var(--ink); cursor: pointer; }
  .mw-tiles button b { font-size: 22px; line-height: 28px; }
  .mw-tiles button span { color: var(--muted); font-size: 16px; line-height: 1.45; }
  .mw-tiles button i { font-style: normal; width: 52px; height: 52px; border-radius: 16px; background: var(--brand-soft); color: var(--brand); display: flex; align-items: center; justify-content: center; margin-bottom: 6px; }
  .mw-code { max-width: 460px; margin: 6vh auto 0; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 14px; text-align: center; box-shadow: var(--shadow); }
  .mw-code h2 { margin: 0; font-size: 24px; }
  .mw-code p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.45; }
  .mw-code input { height: 72px; border: 1px solid var(--line); border-radius: 14px; font: 800 36px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .3em; text-align: center; background: var(--field); color: var(--ink); }
  .mw-code input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .mw-code .err { color: var(--red); font-weight: 700; min-height: 22px; }
  .mw-code .row2 { display: grid; grid-template-columns: 1fr 1.4fr; gap: 12px; }
  .mw-code .row2 button { height: 56px; border-radius: 14px; font-size: 18px; font-weight: 700; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-family: inherit; }
  .mw-code .row2 .ok { background: var(--brand); border-color: var(--brand); color: #fff; }
  .mw-off { text-align: center; color: var(--muted); font-size: 18px; margin-top: 10vh; }
  @media (max-width: 700px) { .mw-tiles { grid-template-columns: 1fr; } }
  .gate { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .gatecard { width: min(440px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 30px 28px; display: flex; flex-direction: column; text-align: center; gap: 14px; }
  .gatecard h2 { margin: 0; font-size: 24px; }
  .gatecard p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.45; }
  .gatecard input { height: 58px; border: 1px solid var(--line); border-radius: 12px; padding: 0 16px; font-size: 22px; text-align: center; background: #fff; }
  .gatecard .gerr { color: var(--red); font-weight: 600; font-size: 15px; }
  .gatecard .gerr:empty { display: none; }
  .gatecard .btn { height: 58px; font-size: 19px; justify-content: center; }
</style>
</head>
<body>
<header id="gkHeader"></header>
<main id="app"></main>
<div id="gate" class="gate hidden"><div class="gatecard">
  <h2>Seite gesperrt</h2>
  <p>Bitte das Passwort des Vereins eingeben. Dieses Gerät bleibt danach freigeschaltet.</p>
  <input type="password" id="gatePw" placeholder="Passwort" autocomplete="current-password">
  <div class="gerr" id="gateErr"></div>
  <button class="btn primary" id="gateGo">Freischalten</button>
</div></div>
<div id="toast" class="toast hidden"></div>
<script src="../../nav.js" data-base="../../" data-active="mitglieder"></script>
<script src="online/antrag.js"></script>
<script src="tablet.js"></script>
</body>
</html>
