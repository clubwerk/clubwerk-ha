<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6b3a">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icon.svg" type="image/svg+xml">
<script src="../../theme-init.js"></script>
<title>Mitglied werden</title>
<link rel="stylesheet" href="../../style.css">
<link rel="stylesheet" href="../../theme.css">
<style>
  /* Gestaltung: Tablet-Kit in style.css (Seite, Kacheln, Sperrseite) – hier nur der Code-Dialog */
  .af, .af input { user-select: text; -webkit-user-select: text; }
  .mw-code { max-width: 460px; margin: 6vh auto 0; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 14px; text-align: center; box-shadow: var(--shadow); }
  .mw-code h2 { margin: 0; font-size: 24px; }
  .mw-code p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.45; }
  .mw-code input { height: 72px; border: 1px solid var(--line); border-radius: 14px; font: 800 36px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .3em; text-align: center; background: var(--field); color: var(--ink); }
  .mw-code input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .mw-code .err { color: var(--red); font-weight: 700; min-height: 22px; }
  .mw-code .row2 { display: grid; grid-template-columns: 1fr 1.4fr; gap: 12px; }
  .mw-code .row2 button { height: 56px; border-radius: 14px; font-size: 18px; font-weight: 700; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-family: inherit; }
  .mw-code .row2 .ok { background: var(--brand); border-color: var(--brand); color: #fff; }
</style>
</head>
<body class="tk">
<header id="gkHeader"></header>
<main id="app"></main>
<div id="gate" class="gate hidden"><div class="gatecard">
  <h2>Seite gesperrt</h2>
  <p>Bitte das Passwort des Vereins eingeben. Dieses Gerät bleibt danach freigeschaltet.</p>
  <input type="password" id="gatePw" placeholder="Passwort" autocomplete="current-password">
  <div class="gerr" id="gateErr"></div>
  <button class="btn primary" id="gateGo">Freischalten</button>
</div></div>
<div id="toast" class="toast hidden"></div>
<script src="../../nav.js" data-base="../../" data-active="mitglieder"></script>
<script src="online/antrag.js"></script>
<script src="tablet.js"></script>
</body>
</html>
