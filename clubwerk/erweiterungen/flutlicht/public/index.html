<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1f6b3a">
  <script src="../../theme-init.js"></script>
  <title>Licht</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../theme.css">
  <link rel="stylesheet" href="../../kit.css">
</head>
<body class="vh-page embedded">
<header id="gkHeader"></header>
<script src="../../nav.js" data-base="../../" data-active="flutlicht"></script>
<main class="vh-main">
  <div class="tab-head"><div><h1 class="tab-title">Licht</h1><p class="tab-sub">Licht antippen, deinen Namen wählen und deine App-PIN eingeben. Es geht von selbst wieder aus.</p></div></div>
  <div class="vh-status"><span class="vh-dot busy" id="dot"></span><span id="st">Verbinde …</span></div>
  <h2 class="sec vh-embed-only">Lichtanlagen</h2>
  <div id="lights" class="vh-tiles lights"></div>
</main>
<div class="vh-sheet" id="sheet"><div class="vh-box">
  <h2 id="title">Licht einschalten</h2>
  <div class="vh-seg" id="dur"></div>
  <p>Wer bist du? Die ersten Buchstaben deines Namens eingeben, dann deine PIN.</p>
  <input class="vh-input" id="q" placeholder="Namen eingeben" autocomplete="off">
  <div class="vh-names" id="nm" style="margin-bottom:10px"></div>
  <input class="vh-input pin" id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="PIN">
  <div class="vh-err" id="err"></div>
  <div class="vh-row"><button class="no" id="no">Abbrechen</button><button class="ok" id="ok">OK</button></div>
</div></div>
<div class="vh-toast" id="toast"></div>
<script src="licht.js"></script>
<script src="tablet.js"></script>
</body>
</html>
