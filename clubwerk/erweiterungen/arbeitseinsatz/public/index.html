<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6b3a">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icon.svg" type="image/svg+xml">
<script src="../../theme-init.js"></script>
<title>Arbeitseinsatz</title>
<link rel="stylesheet" href="../../style.css">
<link rel="stylesheet" href="../../theme.css">
<style>
  /* Gestaltung: Tablet-Kit in style.css (Seite, Abschnitte, Kacheln, Fenster, PIN-Feld, Sperrseite) – hier nur Besonderheiten der Helferdienste */
  .tk-tile .t { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--brand-ink); white-space: nowrap; }
  .aw-note { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 14px 0 0; }
  .aw-note:empty { display: none; }
  .perr { color: var(--red); font-weight: 700; min-height: 22px; margin-top: 10px; }
  .names { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: left; max-height: 50vh; overflow: auto; margin-top: 10px; }
  .names button, .choice button { min-height: 56px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font: inherit; font-size: 16px; font-weight: 600; color: var(--ink); padding: 0 12px; text-align: left; }
  .choice { display: flex; flex-direction: column; gap: 8px; text-align: left; }
  .choice button { display: flex; align-items: center; gap: 10px; }
  .choice button::before { content: ''; flex: none; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); box-sizing: border-box; }
  .choice button.on { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand) inset; }
  .choice button.on::before { border: 5px solid var(--brand); }
  .dialog input.q { width: 100%; height: 54px; border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; font-size: 18px; background: var(--field); color: var(--ink); box-sizing: border-box; user-select: text; -webkit-user-select: text; }
  .dlg-btns { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; margin-top: 14px; }
  .dlg-btns button { height: 56px; border-radius: 14px; font: inherit; font-size: 18px; font-weight: 700; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .dlg-btns .ok { background: var(--brand); border-color: var(--brand); color: #fff; }
  .names-hint { grid-column: 1 / -1; color: var(--muted); font-size: 15px; padding: 14px 4px; text-align: center; }
  @media (max-width: 800px) { .names { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body class="tk">
<header id="gkHeader"></header>
<main><div class="tab-head"><div><h1 class="tab-title">Helferdienste</h1><p class="tab-sub">Einsatz beginnen oder deinen Namen unter „Gerade im Einsatz“ antippen, um ihn zu beenden.</p></div></div>
<h2 class="sec">Was möchtest du tun?</h2>
<div class="tk-grid">
  <button class="tk-tile big span2" id="startBtn"><span class="tk-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z"/></svg></span><span class="tk-txt"><b>Einsatz beginnen</b><span>Namen wählen und PIN eingeben – deine Stunden laufen, bis du dich wieder austrägst.</span></span></button>
</div>
<h2 class="sec">Gerade im Einsatz</h2><div class="tk-grid" id="running"></div>
<h2 class="sec">Heute geplant</h2><div class="tk-grid" id="events"></div><p class="aw-note" id="note"></p>
</main>
<div id="gate" class="gate hidden"><form class="gatecard" id="gateForm" autocomplete="on" action="#">
  <h2>Seite gesperrt</h2>
  <p>Bitte das Passwort des Vereins eingeben. Dieses Gerät bleibt danach freigeschaltet.</p>
  <input type="text" name="username" autocomplete="username" value="Vereinsheim" tabindex="-1" aria-hidden="true" readonly style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
  <input type="password" id="gatePw" placeholder="Passwort" autocomplete="current-password">
  <div class="gerr" id="gateErr"></div>
  <button type="button" class="btn primary" id="gateGo">Freischalten</button>
</form></div>
<div id="overlay" class="overlay hidden"><div class="dialog" id="dialog"></div></div>
<div id="toast" class="toast hidden"></div>
<script src="../../nav.js" data-base="../../" data-active="arbeitseinsatz"></script>
<script src="tablet.js"></script>
</body>
</html>
