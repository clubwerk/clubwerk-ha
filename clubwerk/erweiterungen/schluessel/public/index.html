<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6b3a">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icon.svg" type="image/svg+xml">
<script src="../../theme-init.js"></script>
<title>Schlüsselübergabe</title>
<link rel="stylesheet" href="../../style.css">
<link rel="stylesheet" href="../../theme.css">
<link rel="stylesheet" href="../../kit.css">
<style>
  /* Gestaltung: Tablet-Kit in style.css – hier nur der Code-Dialog und die Übergabe-Karten */
  .sl-code { max-width: 460px; margin: 6vh auto 0; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 14px; text-align: center; }
  .sl-code h2 { margin: 0; font-size: 24px; }
  .sl-code p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.45; }
  .sl-code input { height: 72px; border: 1px solid var(--line); border-radius: 14px; font: 800 36px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .3em; text-align: center; background: var(--field); color: var(--ink); width: 100%; box-sizing: border-box; user-select: text; -webkit-user-select: text; }
  .sl-code input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .sl-code .err { color: var(--red); font-weight: 700; min-height: 22px; }
  .sl-code .row2, .sl-nav { display: grid; grid-template-columns: 1fr 1.4fr; gap: 12px; }
  .sl-code .row2 button, .sl-nav button { height: 56px; border-radius: 14px; font-size: 18px; font-weight: 700; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-family: inherit; }
  .sl-code .row2 .ok, .sl-nav .ok { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
  .sl-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: stretch; }
  .sl-card { background: var(--card); border: 1px solid var(--edge); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; min-width: 0; }
  .sl-card h2 { margin: 0 0 12px; font-size: 20px; }
  .sl-sum { display: grid; grid-template-columns: max-content 1fr; gap: 8px 18px; margin: 0; }
  .sl-sum dt { color: var(--muted); } .sl-sum dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; }
  .sl-terms { white-space: pre-line; overflow-wrap: anywhere; font-size: 16px; line-height: 1.5; margin: 0 0 14px; }
  .sl-agree { display: flex; align-items: center; gap: 12px; background: var(--brand-soft); color: var(--brand-ink); border-radius: 14px; padding: 14px 16px; font-weight: 700; font-size: 17px; cursor: pointer; }
  .sl-agree input { width: 24px; height: 24px; flex: none; accent-color: var(--brand); }
  .sl-sigs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin: 16px 0; }
  .sl-sigs .sg + .sg { margin-top: 0; }
  .sl-err { color: var(--red); font-weight: 700; min-height: 22px; margin: 6px 0; }
  .sl-done { max-width: 520px; margin: 8vh auto 0; text-align: center; }
  @media (max-width: 900px) { .sl-grid, .sl-sigs { grid-template-columns: 1fr; } }
</style>
</head>
<body class="tk">
<header id="gkHeader"></header>
<script src="../../nav.js" data-base="../../" data-active="schluessel"></script>
<main id="app"></main>
<div id="gate" class="gate hidden"><form class="gatecard" id="gateForm" autocomplete="on" action="#">
  <h2>Seite gesperrt</h2>
  <p>Bitte das Passwort des Vereins eingeben. Dieses Gerät bleibt danach freigeschaltet.</p>
  <input type="text" name="username" autocomplete="username" value="Vereinsheim" tabindex="-1" aria-hidden="true" readonly style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
  <input type="password" id="gatePw" placeholder="Passwort" autocomplete="current-password">
  <div class="gerr" id="gateErr"></div>
  <button type="button" class="btn primary" id="gateGo">Freischalten</button>
</form></div>
<div id="toast" class="toast hidden"></div>
<script src="../../unterschrift.js"></script>
<script src="tablet.js"></script>
</body>
</html>
