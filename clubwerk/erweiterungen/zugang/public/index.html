<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1f6b3a">
  <script src="../../theme-init.js"></script>
  <title>Zugang</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../theme.css">
  <link rel="stylesheet" href="../../kit.css">
</head>
<style>
  /* Namenssuche wie auf den übrigen Tablet-Seiten (Verkauf, Plätze, Helferdienste): erst nach 2 Buchstaben Vorschläge */
  .zg-names { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 0 0 10px; text-align: left; max-height: 40vh; overflow: auto; }
  .zg-names button { min-height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font: inherit; font-size: 16px; font-weight: 600; color: var(--ink); padding: 0 12px; text-align: left; }
  .zg-names button.on { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); background: var(--brand-soft); }
  .zg-names .hint { grid-column: 1 / -1; color: var(--muted); font-size: 15px; padding: 6px 4px; text-align: center; }
</style>
<body class="vh-page embedded">
<header id="gkHeader"></header>
<main class="vh-main">
  <div class="tab-head"><div><h1 class="tab-title">Zugang</h1><p class="tab-sub">Zum Öffnen antippen, deinen Namen wählen und deine App-PIN eingeben.</p></div></div>
  <div class="vh-status"><span class="vh-dot busy" id="dot"></span><span id="st">Verbinde …</span></div>
  <h2 class="sec vh-embed-only">Türen</h2>
  <div id="doors" style="display:flex;flex-direction:column;gap:12px"></div>
</main>
<div class="vh-sheet" id="sheet"><div class="vh-box">
  <h2 id="title">Tür öffnen</h2>
  <p>Wer bist du? Die ersten Buchstaben deines Namens eingeben, dann deine PIN.</p>
  <input class="vh-input" id="q" placeholder="Namen eingeben" autocomplete="off">
  <div class="zg-names" id="nm"></div>
  <input class="vh-input pin" id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="PIN">
  <div class="vh-err" id="err"></div>
  <div class="vh-row"><button class="no" id="no">Abbrechen</button><button class="ok" id="ok">OK</button></div>
</div></div>
<div class="vh-toast" id="toast"></div>
<script src="../../nav.js" data-base="../../" data-active="zugang"></script>
<script src="doors.js"></script>
<script src="app.js"></script>
</body>
</html>
