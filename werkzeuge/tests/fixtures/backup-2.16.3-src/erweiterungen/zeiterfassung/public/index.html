<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1f6b3a">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icon.svg" type="image/svg+xml">
<title>Zeiterfassung</title>
<link rel="stylesheet" href="../../style.css">
<link rel="stylesheet" href="../../theme.css">
<style>
  :root { --np: 16px; }
  body { user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 22px; background: var(--green); color: #fff; }
  header.top h1 { margin: 0; font-size: 22px; font-weight: 700; }
  header.top .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .logo-badge { background: #fff; border-radius: 999px; padding: 3px; display: flex; align-items: center; justify-content: center; flex: none; }
  .logo-badge img { height: 50px; max-width: 140px; object-fit: contain; display: block; }
  header.top nav { display: flex; align-items: center; gap: 22px; }
  header.top nav a { color: #fff; opacity: .75; font-size: 15px; text-decoration: none; padding: 4px 0; border-bottom: 2px solid transparent; }
  header.top nav a.on { opacity: 1; font-weight: 700; border-bottom-color: #fff; }
  header.top nav .ext { font-size: 12px; opacity: .8; }
  header.top .clock { font-size: 20px; font-variant-numeric: tabular-nums; opacity: .9; }
  main { padding: 18px 22px 30px; }
  h2.sec { font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 6px 0 14px 0; }
  .staff { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .staff button { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; min-height: 170px;
    padding: 18px var(--np); border-radius: var(--radius); background: var(--card); border: 1px solid var(--line); }
  .staff button.isin { border-color: var(--green); box-shadow: inset 0 0 0 1px var(--green); }
  .staff button.warn { border-color: var(--red); box-shadow: inset 0 0 0 1px var(--red); }
  .staff b { font-size: 22px; }
  .staff .job { color: var(--muted); font-size: 15px; }
  .staff .st { margin-top: auto; font-size: 17px; font-weight: 700; padding: 6px 12px; border-radius: 999px; background: #f1efe8; color: var(--muted); }
  .staff .isin .st { background: var(--green-soft); color: var(--green-dark); }
  .staff .warn .st { background: var(--red-soft); color: var(--red); }
  .hint { margin: 18px 0 0 0; color: var(--muted); font-size: 16px; }
  .empty { margin: 30px 0; text-align: center; color: var(--muted); font-size: 18px; }
  .overlay { position: fixed; inset: 0; background: rgba(20,20,18,.55); z-index: 20; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .dialog { background: var(--card); border-radius: 18px; padding: 22px 24px; width: min(440px, 100%); text-align: center; }
  .dialog h2 { margin: 0 0 4px; font-size: 24px; }
  .dialog .sub { color: var(--muted); font-size: 17px; }
  .pin-dots { display: flex; justify-content: center; gap: 14px; margin: 18px 0; }
  .pin-dots span { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--green); }
  .pin-dots span.f { background: var(--green); }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .pad button { height: 70px; border-radius: 14px; background: #f1efe8; font-size: 28px; font-weight: 700; }
  .pad button.fn { font-size: 18px; background: transparent; border: 1px solid var(--line); }
  .err { color: var(--red); text-align: center; margin-top: 12px; font-weight: 600; }
  .err:empty { display: none; }
  .done .big { font-size: 64px; line-height: 1; color: var(--green); }
  .done .big.r { color: var(--red); }
  .done .when { font-size: 28px; font-weight: 700; margin: 8px 0 4px; }
  .done .kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; text-align: left; background: #f7f6f2; border-radius: 12px; padding: 14px 16px; margin: 14px 0 18px; font-size: 17px; }
  .done .kv span { color: var(--muted); }
  .done .kv b { text-align: right; font-variant-numeric: tabular-nums; }
  .done .note { background: var(--amber-soft); color: var(--amber); padding: 10px 12px; border-radius: 10px; font-weight: 600; margin: 12px 0 0; }
  .done .btn { width: 100%; min-height: 58px; font-size: 20px; justify-content: center; }
  @media (max-width: 640px) {
    header.top { padding: 10px 14px; flex-wrap: wrap; }
    header.top h1 { font-size: 17px; }
    header.top .clock, .logo-badge { display: none; }
    main { padding: 14px; }
  }
  @media (orientation: landscape) and (max-height: 820px) {
    header.top { padding: 8px 22px; }
    .logo-badge img { height: 40px; }
    main { padding-top: 10px; }
  }
  .gate { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .gatecard { width: min(440px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 30px 28px;
    display: flex; flex-direction: column; text-align: center; gap: 14px; user-select: text; -webkit-user-select: text; }
  .gatecard h2 { margin: 0; font-size: 24px; }
  .gatecard p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.45; }
  .gatecard input { height: 58px; border: 1px solid var(--line); border-radius: 12px; padding: 0 16px; font-size: 22px; text-align: center; background: #fff; }
  .gatecard .gerr { color: var(--red); font-weight: 600; font-size: 15px; }
  .gatecard .gerr:empty { display: none; }
  .gatecard .btn { height: 58px; font-size: 19px; justify-content: center; }
</style>
</head>
<body>
<header id="gkHeader"></header>
<main>
  <h2 class="sec">Wer kommt oder geht?</h2>
  <div class="staff" id="staff"></div>
  <p class="hint" id="hint">Kachel antippen und PIN eingeben – die App erkennt selbst, ob du kommst oder gehst.</p>
</main>
<div id="gate" class="gate hidden"><div class="gatecard">
  <h2>Seite gesperrt</h2>
  <p>Bitte das Passwort des Vereins eingeben. Dieses Gerät bleibt danach freigeschaltet.</p>
  <input type="password" id="gatePw" placeholder="Passwort" autocomplete="current-password">
  <div class="gerr" id="gateErr"></div>
  <button class="btn primary" id="gateGo">Freischalten</button>
</div></div>
<div id="overlay" class="overlay hidden"><div class="dialog" id="dialog"></div></div>
<div id="toast" class="toast hidden"></div>
<script src="../../nav.js" data-base="../../" data-active="zeiterfassung"></script>
<script src="tablet.js"></script>
</body>
</html>
