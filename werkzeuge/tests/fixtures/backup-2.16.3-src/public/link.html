<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6b3a">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Vereinsheim</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 22px; background: var(--green); color: #fff; flex: none; }
  header.top h1 { margin: 0; font-size: 22px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header.top nav { display: flex; align-items: center; gap: 22px; }
  header.top nav a { color: #fff; opacity: .75; font-size: 15px; text-decoration: none; padding: 4px 0; border-bottom: 2px solid transparent; }
  header.top nav a.on { opacity: 1; font-weight: 700; border-bottom-color: #fff; }
  header.top nav .ext { font-size: 12px; opacity: .8; }
  header.top .clock { font-size: 20px; font-variant-numeric: tabular-nums; opacity: .9; }
  iframe { flex: 1; width: 100%; border: 0; background: #fff; }
  .msg { margin: 40px auto; color: var(--muted); font-size: 18px; text-align: center; }
  @media (orientation: landscape) and (max-height: 820px) { header.top { padding: 8px 22px; } }
  @media (max-width: 640px) { header.top { padding: 10px 14px; flex-wrap: wrap; } header.top h1 { font-size: 17px; } header.top .clock { display: none; } }
</style>
</head>
<body>
<header id="gkHeader"></header>
<iframe id="frame" title="Externe Seite" referrerpolicy="no-referrer" allow="fullscreen; clipboard-write" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads"></iframe>
<script src="nav.js" data-base="" data-active="link"></script>
<script src="link.js"></script>
</body>
</html>
